<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#162b2a" />
    <meta name="description" content="守住一间武馆，打穿五段街巷。原创单人横版格斗游戏。" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="mask-icon" href="/brand-mark.svg" color="#bd4f36" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="巷战回声" />
    <title>巷战回声 · 拳过旧巷，回声犹在</title>
  </head>
  <body>
    <main id="game">
      <canvas id="world" aria-label="巷战回声 3D 战场"></canvas>
      <div id="screen" class="screen"></div>
      <div id="hud" class="hud" aria-live="polite"></div>
      <div id="toast" class="toast" aria-live="assertive"></div>
      <div id="touch-controls" class="touch-controls" aria-label="触控操作">
        <div class="stick-wrap"><div class="stick-base"><div id="stick-knob" class="stick-knob"></div></div><span>移动</span></div>
        <div class="touch-actions">
          <button data-action="light" class="touch-button light">轻拳</button>
          <button data-action="heavy" class="touch-button heavy">重击</button>
          <button data-action="jump" class="touch-button jump">跳跃</button>
          <button data-action="dodge" class="touch-button dodge">翻滚</button>
          <button data-action="special" class="touch-button special">绝招</button>
          <button data-action="finisher" class="touch-button finisher">终结</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
